<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Риск-профилировщик | Risk Profiler</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#0d1f3c;--navy2:#162d52;--navy3:#1e3a6e;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5e199;
  --sky:#4a9fd4;--sky2:#7bbee8;--sky3:#b8daf5;--sky4:#dceefa;--sky5:#eef6fd;
  --white:#ffffff;--text:#0d1f3c;--text2:#2a4a7f;--text3:#4a6fa5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0d1f3c 0%,#162d52 40%,#1a3a6a 70%,#0d2a4a 100%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.app{background:var(--sky5);width:100%;max-width:700px;border-radius:24px;padding:0;color:var(--text);box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 0 1px rgba(201,168,76,.18);overflow:hidden}
.top-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy2) 100%);display:flex;justify-content:space-between;align-items:center;padding:1rem 1.75rem;border-bottom:2px solid var(--gold)}
.app-title{font-size:16px;font-weight:700;color:var(--white);letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.app-title-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.content{padding:1.75rem}
.progress-wrap{margin-bottom:1.5rem}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-label{font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase}
.progress-count{font-size:12px;font-weight:700;color:var(--gold)}
.progress-bg{background:var(--sky3);border-radius:99px;height:6px}
.progress-fill{background:linear-gradient(90deg,var(--sky),var(--gold));height:6px;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.qcard{background:var(--white);border:1.5px solid var(--sky3);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 2px 12px rgba(13,31,60,.06)}
.qnum{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.qsub{font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5;font-style:italic;background:var(--sky4);border-radius:8px;padding:8px 12px;border-left:3px solid var(--sky2)}
.qtext{font-size:16px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:1.25rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--sky5);border:1.5px solid var(--sky3);border-radius:12px;padding:.75rem 1rem;text-align:left;cursor:pointer;font-size:14px;color:var(--text);line-height:1.4;width:100%;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:10px}
.opt::before{content:'';width:18px;height:18px;min-width:18px;border-radius:50%;border:2px solid var(--sky2);transition:all .15s}
.opt:hover{background:var(--sky4);border-color:var(--sky);transform:translateX(2px)}
.opt.sel{background:linear-gradient(90deg,var(--navy),var(--navy2));border-color:var(--gold);color:var(--white);transform:translateX(2px)}
.opt.sel::before{background:var(--gold);border-color:var(--gold)}
.scale-wrap{display:flex;flex-direction:column;gap:12px}
.scale-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:500}
.scale-btns{display:flex;gap:6px;flex-wrap:wrap}
.scale-btn{width:50px;height:50px;border-radius:12px;border:1.5px solid var(--sky3);background:var(--sky5);font-size:15px;font-weight:700;color:var(--text3);cursor:pointer;font-family:inherit;transition:all .15s}
.scale-btn:hover{background:var(--sky4);border-color:var(--sky);color:var(--navy)}
.scale-btn.sel{background:linear-gradient(135deg,var(--navy),var(--navy2));border-color:var(--gold);color:var(--gold2);box-shadow:0 2px 8px rgba(13,31,60,.2)}
.num-wrap{display:flex;flex-direction:column;gap:8px}
.num-wrap label{font-size:13px;color:var(--text3);font-weight:500}
.num-wrap input{background:var(--white);border:1.5px solid var(--sky3);border-radius:12px;padding:.7rem 1rem;font-size:16px;color:var(--text);width:100%;outline:none;font-family:inherit;font-weight:500;transition:border-color .15s}
.num-wrap input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(74,159,212,.15)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn-back{background:transparent;color:var(--text3);border:1.5px solid var(--sky3);border-radius:12px;padding:.6rem 1.25rem;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;transition:all .15s}
.btn-back:hover{background:var(--sky4);color:var(--navy)}
.btn-back:disabled{opacity:.3;cursor:default}
.btn-next{background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--white);border:none;border-radius:12px;padding:.6rem 1.75rem;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;border-bottom:2px solid var(--gold);transition:all .15s}
.btn-next:hover{opacity:.9;transform:translateY(-1px)}
.btn-next:disabled{opacity:.3;cursor:default;transform:none}
.welcome-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
.welcome-hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.12),transparent 70%);top:-80px;right:-60px}
.welcome-hero::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(74,159,212,.1),transparent 70%);bottom:-60px;left:-40px}
.welcome-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);border-radius:99px;padding:4px 14px;font-size:11px;font-weight:700;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:1.25rem}
.welcome-title{font-size:26px;font-weight:700;color:var(--white);margin-bottom:.6rem;line-height:1.25}
.welcome-title span{color:var(--gold2)}
.welcome-sub{font-size:14px;color:rgba(255,255,255,.65);line-height:1.7;max-width:380px;margin:0 auto 1.75rem}
.welcome-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.75);font-weight:500}
.welcome-body{padding:1.75rem}
.welcome-field-label{font-size:13px;font-weight:600;color:var(--text3);margin-bottom:.6rem}
.welcome-input{background:var(--white);border:2px solid var(--sky3);border-radius:14px;padding:.8rem 1.1rem;font-size:16px;color:var(--text);width:100%;outline:none;font-family:inherit;font-weight:500;transition:all .15s;margin-bottom:1rem}
.welcome-input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(74,159,212,.12)}
.welcome-input::placeholder{color:var(--sky2)}
.welcome-start{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:var(--navy);border:none;border-radius:14px;padding:.85rem 2rem;font-size:15px;cursor:pointer;font-weight:700;font-family:inherit;width:100%;box-shadow:0 4px 16px rgba(201,168,76,.35);transition:all .2s;letter-spacing:.02em}
.welcome-start:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,168,76,.45)}
.welcome-start:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.res-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:1.5rem 1.75rem;border-bottom:2px solid var(--gold)}
.res-greeting-line{font-size:13px;color:var(--gold2);font-weight:600;margin-bottom:4px}
.res-profile-name{font-size:22px;font-weight:700;color:var(--white);margin-bottom:8px}
.res-badge-row{display:flex;align-items:center;gap:10px}
.res-badge{display:inline-block;border-radius:99px;padding:4px 16px;font-size:12px;font-weight:700;border:1.5px solid var(--gold);color:var(--gold2);background:rgba(201,168,76,.12);letter-spacing:.05em;text-transform:uppercase}
.res-body{padding:1.5rem 1.75rem}
.res-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:1rem;padding:1rem;background:var(--white);border-radius:12px;border-left:3px solid var(--gold)}
.section-head{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--sky3),transparent)}
.params-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.25rem}
.param-item{background:var(--white);border:1px solid var(--sky3);border-radius:12px;padding:.75rem 1rem}
.param-key{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.param-val{font-size:15px;font-weight:700;color:var(--text)}
.risk-meter-wrap{background:var(--white);border:1px solid var(--sky3);border-radius:12px;padding:1rem 1.25rem}
.meter-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);font-weight:600;margin-bottom:8px}
.meter-track{height:10px;background:linear-gradient(90deg,#5dcaa5,#fac775,#f09595,#e24b4a);border-radius:99px;position:relative}
.meter-pin{position:absolute;top:-5px;width:20px;height:20px;background:var(--navy);border:2.5px solid var(--gold);border-radius:50%;transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.meter-pct{text-align:center;font-size:20px;font-weight:700;color:var(--navy);margin-top:10px}
.chart-block{display:flex;gap:1.5rem;align-items:center;background:var(--white);border:1px solid var(--sky3);border-radius:12px;padding:1.25rem;flex-wrap:wrap}
.chart-wrap{flex:0 0 auto;position:relative;width:160px;height:160px}
.chart-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.chart-center-pct{font-size:24px;font-weight:700;color:var(--navy)}
.chart-center-lbl{font-size:11px;color:var(--text3);font-weight:500}
.legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:10px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-txt{font-size:13px;color:var(--text);flex:1;font-weight:500}
.legend-pct{font-size:13px;font-weight:700;color:var(--navy)}
.strat-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.strat-list li{font-size:13px;color:var(--text2);padding:.65rem .85rem;line-height:1.6;background:var(--white);border-radius:10px;border:1px solid var(--sky3);font-weight:400;border-left:3px solid var(--sky2)}
.rec-block{display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--white);border:1px solid var(--sky3);border-radius:12px;padding:.85rem 1rem;display:flex;gap:12px;align-items:flex-start}
.rec-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px;box-shadow:0 2px 8px rgba(13,31,60,.2)}
.rec-head{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:3px}
.rec-text{font-size:13px;color:var(--text3);line-height:1.55}
.warn-box{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);border-radius:12px;padding:.85rem 1rem;font-size:12px;color:var(--text3);line-height:1.5;margin-top:1rem}
.breakdown-wrap{display:flex;flex-direction:column;gap:10px;margin-top:.25rem}
.bk-class{background:var(--white);border:1px solid var(--sky3);border-radius:12px;overflow:hidden}
.bk-header{display:flex;align-items:center;gap:10px;padding:.65rem 1rem;background:var(--sky5);border-bottom:1px solid var(--sky3)}
.bk-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.bk-class-name{font-size:13px;font-weight:700;color:var(--navy);flex:1}
.bk-class-pct{font-size:14px;font-weight:700;color:var(--gold)}
.bk-rows{padding:.4rem 0}
.bk-row{display:flex;align-items:center;gap:8px;padding:.35rem 1rem .35rem 2.25rem;position:relative}
.bk-row::before{content:'';position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--sky2)}
.bk-sub-name{font-size:13px;color:var(--text2);flex:1;line-height:1.4}
.bk-bar-wrap{width:80px;height:5px;background:var(--sky4);border-radius:99px;flex-shrink:0}
.bk-bar{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--navy2))}
.bk-sub-pct{font-size:12px;font-weight:700;color:var(--text3);min-width:32px;text-align:right}
.action-btns{display:flex;gap:10px;padding:0 1.75rem 1.75rem}
.download-btn{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:var(--navy);border:none;border-radius:12px;padding:.7rem 1.5rem;font-size:14px;cursor:pointer;font-weight:700;font-family:inherit;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 12px rgba(201,168,76,.3);transition:all .2s}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(201,168,76,.4)}
.restart-btn{background:transparent;border:1.5px solid var(--sky3);color:var(--text2);border-radius:12px;padding:.7rem 1.25rem;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;flex:1;transition:all .15s}
.restart-btn:hover{background:var(--sky4);border-color:var(--sky)}
@media print{body{background:#fff;padding:0}.app{box-shadow:none;border-radius:0;max-width:100%}.top-bar,.action-btns{display:none}.res-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.meter-track,.meter-pin,.legend-dot,.rec-icon{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:500px){body{padding:.75rem .5rem}.content{padding:1.25rem}.scale-btn{width:42px;height:42px;font-size:13px}.chart-block{flex-direction:column;align-items:flex-start}.params-grid{grid-template-columns:1fr}.action-btns{flex-direction:column;padding:0 1.25rem 1.25rem}.res-hero,.res-body{padding:1.25rem}}
</style>
</head>
